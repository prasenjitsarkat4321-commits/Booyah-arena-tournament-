name: Build BOOYAH ARENA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies & build dist
        run: |
          npm ci || npm install
          npm run build

      - name: Initialize Capacitor Android & Copy Icons
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android
          mkdir -p android/app/src/main/res/drawable
          cp public/pwa-512x512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp public/pwa-512x512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload BOOYAH ARENA APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOOYAH-ARENA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
