name: Deploy BOOYAH ARENA to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies & build dist
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy to Firebase Hosting (pristine-folder-tc62s.web.app)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e
          trap 'rm -f /tmp/firebase-sa.json' EXIT

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing GitHub Secret FIREBASE_SERVICE_ACCOUNT. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json

          if ! node -e "const d = JSON.parse(require('fs').readFileSync('/tmp/firebase-sa.json', 'utf8')); if (!d.private_key || !d.client_email) process.exit(1);"; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not a valid Firebase Service Account JSON key (missing private_key or client_email)."
            exit 1
          fi

          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          npx --yes firebase-tools@latest deploy --only hosting --project pristine-folder-tc62s --non-interactive
