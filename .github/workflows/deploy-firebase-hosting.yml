name: Deploy BOOYAH ARENA to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies & build dist
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx firebase-tools deploy --only hosting --project pristine-folder-tc62s --non-interactive
          
